<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Verified Sponsor &bull; Exclusive Promotion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #334155;
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 36px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      background: #f59e0b;
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #0f172a;
      font-size: 15px;
      font-weight: 800;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }
    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Verified Sponsor Offer</span>
    <h1 id="offerTitle">Apex Sports Network Special Access</h1>
    <p id="offerDesc">Congratulations! You have unlocked verified VIP access with a 100% deposit match bonus & zero withdrawal fees via HilltopAds Network.</p>
    <button class="btn" onclick="claimOffer()">Claim VIP Offer Now &rarr;</button>
    <div class="footer">&#10003; SSL Encrypted &bull; 24/7 Verified Partner Security</div>
  </div>

  <script>
    function claimOffer() {
      alert("Offer Activated! Redirecting to secure registration...");
      window.location.href = "https://sportsnewselite.blogspot.com/";
    }
  </script>
</body>
</html>
